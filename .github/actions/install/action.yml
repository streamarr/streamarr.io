name: Install dependencies
description: Sets up the Node version in .nvmrc and installs one package's locked dependencies.

inputs:
  package:
    description: The package directory to install, cms or site.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: ${{ inputs.package }}/package-lock.json
    # No dependency needs its lifecycle scripts here, so none of them run.
    - run: npm ci --ignore-scripts
      shell: bash
      working-directory: ${{ inputs.package }}
